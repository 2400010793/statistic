[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-embryo-benchmark"
version = "0.1.0"
description = "Reproducible Virtual Embryo baselines, public resource acquisition and local scoring"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.2,<2",
  "anndata>=0.10,<0.12",
  "requests>=2.28,<3",
  "veckit==0.1.1",
]

[project.optional-dependencies]
flow = ["torch>=2.0"]
papers = ["torch>=2.0", "geomloss>=0.2,<0.4", "POT>=0.9,<0.10", "matplotlib>=3.3", "tqdm>=4"]
dev = ["pytest>=7"]

[project.scripts]
embryo-benchmark = "virtual_embryo_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtual_embryo_benchmark = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
